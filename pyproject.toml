[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccwork"
version = "0.2.0"
description = "Qt desktop GUI for running Claude Code across many repos."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "kleer001" }]
keywords = ["claude", "claude-code", "qt", "pyside6", "terminal", "xterm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/kleer001/ccwork"
Issues = "https://github.com/kleer001/ccwork/issues"

[project.gui-scripts]
ccwork = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
