<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 90">
  <!-- v4b: larger C-arrows, boxed "work" panel -->
  <!--
    r=30, r*sin45=21.2
    C1: center (44,45) → start (65.2,66.2), end (65.2,23.8)
    C2: center (112,45) → start (133.2,66.2), end (133.2,23.8)
  -->
  <defs>
    <marker id="bh-orange" markerWidth="9" markerHeight="9"
            refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 9,4.5 0,9" fill="#e07820"/>
    </marker>
    <marker id="bh-khaki" markerWidth="9" markerHeight="9"
            refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 9,4.5 0,9" fill="#c9a84c"/>
    </marker>
  </defs>

  <!-- First C: orange, center (44, 45), r=30 -->
  <path d="M 65.2,66.2 A 30,30 0 1,1 65.2,23.8"
        stroke="#e07820" stroke-width="5" fill="none"
        marker-end="url(#bh-orange)"/>

  <!-- Second C: khaki, center (112, 45), r=30 -->
  <path d="M 133.2,66.2 A 30,30 0 1,1 133.2,23.8"
        stroke="#c9a84c" stroke-width="5" fill="none"
        marker-end="url(#bh-khaki)"/>

  <!-- Boxed "work" -->
  <rect x="158" y="12" width="162" height="66" rx="13"
        fill="#1a1a1a" stroke="#e07820" stroke-width="2"/>
  <text x="239" y="56" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="38" font-weight="bold" fill="#f0ede6">work</text>
</svg>
