name: Tests
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install ruff
      run: python -m pip install 'ruff>=0.6'
    - name: ruff check
      run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Span the supported range so wheel-availability regressions
        # surface quickly. 3.10 is the floor declared in pyproject.toml.
        python-version: ['3.10', '3.11', '3.12']
    env:
      # Qt has no display on CI. Set at the env level so it applies before
      # the first PySide6 import in any test file, independent of per-file
      # os.environ.setdefault() timing.
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Qt offscreen system libraries
      # PySide6 wheels bundle Qt, but Qt still dlopen()s a few system libs
      # even for the offscreen platform plugin (libxkbcommon, libegl, the
      # dbus client, libxcb-cursor since Qt 6.5). Keep this list tight —
      # we only need what offscreen requires, not a full X stack.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 \
          libxkbcommon0 \
          libxcb-cursor0 \
          libdbus-1-3 \
          libfontconfig1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest -v
