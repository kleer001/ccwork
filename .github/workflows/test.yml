name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Qt has no display on CI. Set at the env level so it applies before
      # the first PySide6 import in any test file, independent of per-file
      # os.environ.setdefault() timing.
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Pin a version known to have PySide6 wheels. '3.x' drifts to the
        # newest release, which can outpace PySide6's wheel support.
        python-version: '3.12'

    - name: Install Qt offscreen system libraries
      # PySide6 wheels bundle Qt, but Qt still dlopen()s a few system libs
      # even for the offscreen platform plugin (libxkbcommon, libegl, the
      # dbus client, libxcb-cursor since Qt 6.5). Keep this list tight —
      # we only need what offscreen requires, not a full X stack.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 \
          libxkbcommon0 \
          libxcb-cursor0 \
          libdbus-1-3 \
          libfontconfig1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest -v
