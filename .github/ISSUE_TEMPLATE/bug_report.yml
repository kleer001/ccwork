name: Bug report
description: Something isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! The three fields below
        (distro, X11 vs XWayland, xterm version) resolve most reports —
        please don't skip them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs. actual behavior.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      description: e.g. Ubuntu 24.04, Fedora 40, Arch
    validations:
      required: true
  - type: dropdown
    id: display-server
    attributes:
      label: Display server
      description: ccwork is X11/XWayland only.
      options:
        - X11 (native)
        - XWayland (Wayland session)
        - Not sure
    validations:
      required: true
  - type: input
    id: xterm-version
    attributes:
      label: xterm version
      description: Output of `xterm -version`
    validations:
      required: true
  - type: input
    id: ccwork-version
    attributes:
      label: ccwork version / commit
      description: Release tag or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Run with `CCWORK_LOG=DEBUG ./bin/ccwork` and paste any relevant
        output. This will be formatted as code automatically.
      render: shell
    validations:
      required: false
